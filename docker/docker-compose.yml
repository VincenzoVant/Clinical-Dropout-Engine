services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: VincenzoVantornout
      POSTGRES_PASSWORD: localdevpassword
    ports: 
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U VincenzoVantornout"]
      interval: 5s
      timeout: 5s
      retries: 5
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.latest
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      loader: 
        condition: service_completed_successfully
    volumes: 
      - ../dbt:/usr/app/dbt
    environment: 
      DBT_USER: VincenzoVantornout
      DBT_PASSWORD: localdevpassword
      DBT_HOST: postgres
      DBT_DBNAME: postgres
      DBT_SCHEMA: public 
      DBT_PROFILES_DIR: /usr/app/dbt
    entrypoint: ["/bin/sh", "-c"]
    command: ["dbt deps && dbt build"]

  api: 
    build:
      context: ../api
      dockerfile: Dockerfile 
    ports: 
    - "8000:8000"
    depends_on:
      dbt:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: VincenzoVantornout
      DB_PASSWORD: localdevpassword
      DB_NAME: postgres
  dashboard: 
    build: 
      context: ../dashboard
      dockerfile: Dockerfile 
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started
    environment:
      API_URL: http://api:8000
  
  loader:
    build:
      context: ../loader
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../data/raw:/data/raw:ro
    environment: 
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: VincenzoVantornout
      DB_PASSWORD: localdevpassword
      DB_NAME: postgres
      RAW_DATA_DIR: /data/raw
    
      
    

    
 

volumes:
  postgres-data:
      

  